<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Детроид</title>
<style>
  :root {
    --primary: #714B67; --primary-dark: #5a3b52; --success: #28a745; --danger: #dc3545;
    --bg: #f0f1f5; --panel: #fff; --border: #d1d4de; --text: #2c3e50; --muted: #888;
    --column-bg: #e3e5ec;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.12); --shadow-md: 0 4px 12px rgba(0,0,0,.15);
    --shadow-lg: 0 5px 15px rgba(0,0,0,.3);
    --radius: 4px; --radius-lg: 8px;
  }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { height: 100%; width: 100%; }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
  button, input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: none; align-items: center; justify-content: center; }
  #login-overlay.show { display: flex; }
  .login-card { background: #fff; padding: 35px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 380px; }
  .login-card h2 { margin-bottom: 20px; color: var(--primary); text-align: center; }
  .login-err { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  header { background: var(--primary); color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .brand { cursor: pointer; font-size: 16px; font-weight: 700; opacity: .9; }
  .brand:hover { opacity: 1; }
  .nav-menu { display: flex; gap: 20px; margin-left: 30px; }
  .nav-item { cursor: pointer; opacity: 0.7; font-weight: 500; border-bottom: 2px solid transparent; padding-bottom: 2px; }
  .nav-item.active, .nav-item:hover { opacity: 1; border-bottom-color: #fff; }
  .user-info { display: flex; align-items: center; gap: 15px; font-size: 13px; margin-left: auto;}
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; transition: background .3s; }
  .conn-dot.offline { background: #ef4444; }
  .logout-btn { cursor: pointer; opacity: 0.7; text-decoration: underline; }
  .logout-btn:hover { opacity: 1; }

  .breadcrumb, .toolbar { background: var(--panel); padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; flex-shrink: 0; gap: 10px; flex-wrap: wrap; }
  .breadcrumb { font-size: 13px; color: #666; gap: 6px; }
  .breadcrumb a { cursor: pointer; color: var(--primary); font-weight: 500; }
  .breadcrumb a:hover { text-decoration: underline; }
  .toolbar { justify-content: space-between; }
  #kanban-view > .toolbar { display: grid; grid-template-columns: 1fr minmax(240px, 520px) 1fr; align-items: center; gap: 12px; }
  #kanban-view > .toolbar > .btn { justify-self: start; }
  .board-search { position: relative; width: 100%; justify-self: center; min-width: 0; }
  .board-search-field { position: relative; }
  .board-search input {
    width: 100%; padding: 8px 36px 8px 14px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 14px; background: #fff; text-align: left;
  }
  .board-search input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(113,75,103,.1); }
  .board-search .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: #888; cursor: pointer; font-size: 18px; line-height: 1; padding: 4px;
    display: none;
  }
  .board-search.has-query .search-clear { display: block; }
  .search-drop {
    display: none; position: fixed; left: 0; top: 0; width: 320px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); z-index: 8000; max-height: 360px; overflow-y: auto;
  }
  .search-drop.open { display: block; }
  .search-item { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .search-item:last-child { border-bottom: 0; }
  .search-item:hover { background: #f7f5f7; }
  .search-item-title { font-weight: 700; font-size: 13px; color: #1e293b; }
  .search-item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .search-item-warn { font-size: 12px; color: #b45309; margin-top: 4px; font-weight: 600; }
  .search-item.other { cursor: default; background: #fffbeb; }
  .search-item.other:hover { background: #fef3c7; }
  .search-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }

  .btn { padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; border: 1px solid transparent; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .15s; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-secondary { background: #f1f1f1; color: #333; border-color: #ccc; }
  .btn-secondary:hover:not(:disabled) { background: #e4e4e4; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .dropdown { position: relative; }
  .dropdown-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 200px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); z-index: 200; overflow: hidden; }
  .dropdown-menu.open { display: block; }
  .dropdown-item { padding: 10px 15px; font-size: 13px; cursor: pointer; display: flex; gap: 8px; border-bottom: 1px solid #eee; }
  .dropdown-item.danger { color: var(--danger); }
  .dropdown-item:hover { background: #f9f9f9; }

  .view-section { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .view-section.active { display: flex; }

  .kanban-board { flex: 1; display: flex; overflow-x: auto; padding: 15px; gap: 12px; align-items: flex-start; }
  .column { background: var(--column-bg); width: 260px; flex-shrink: 0; border-radius: 6px; display: flex; flex-direction: column; max-height: 100%; transition: opacity .2s; }
  .column.dragging { opacity: .4; }
  .column.drop-target { outline: 2px dashed var(--primary); outline-offset: -2px; }
  .column-header { padding: 10px 12px; font-weight: 700; font-size: 13px; color: #4c4c4c; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); cursor: grab; user-select: none; }
  .col-title { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .col-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-edit { color: var(--muted); cursor: pointer; font-size: 12px; opacity: 0; padding: 2px 4px; flex-shrink: 0; }
  .column-header:hover .col-edit { opacity: 1; }
  .col-count { background: #ccc; padding: 2px 6px; border-radius: 10px; font-size: 11px; color: #555; flex-shrink: 0; }
  .cards-container { padding: 8px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 50px; }
  .card { background: #fff; border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow-sm); cursor: grab; border-left: 3px solid var(--primary); transition: transform .1s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,.1); }
  .card.dragging { opacity: .5; }
  .card-title { font-weight: 700; font-size: 13px; word-wrap: break-word; line-height: 1.3; }
  .card-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; gap: 5px;}
  .card-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-column { width: 260px; flex-shrink: 0; background: rgba(0,0,0,.05); border: 1px dashed #bbb; border-radius: 6px; padding: 10px; text-align: center; color: #666; cursor: pointer; font-weight: 700; font-size: 13px; }

  .stages-row { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .stage-btn { padding: 6px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 500; border: 1px solid #ccc; background: #fff; color: #555; cursor: pointer; transition: background .2s; }
  .stage-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .detail-body { display: flex; flex: 1; overflow: hidden; }
  .form-panel { flex: 1.5; padding: 25px 40px; overflow-y: auto; border-right: 1px solid var(--border); }
  .editable-title { font-size: 24px; font-weight: 700; width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 8px; border-radius: var(--radius); margin-bottom: 25px; color: var(--text); transition: border .2s; }
  .editable-title:focus { border-color: var(--primary); outline: none; background: #fff; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-row { display: flex; align-items: center; font-size: 13px; gap: 8px; margin-bottom: 12px; }
  .form-label { width: 130px; color: #555; font-weight: 700; flex-shrink: 0; }
  .form-input { flex: 1; border: 1px solid transparent; background: transparent; padding: 6px 8px; border-radius: var(--radius); font-size: 13px; min-width: 0; transition: border .2s; }
  .form-input:focus { border-color: var(--primary); background: #fff; outline: none; }
  .section-title { margin: 35px 0 15px; color: #555; font-size: 13px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-transform: uppercase; }

  .chatter { flex: 1; background: #f9f9fb; display: flex; flex-direction: column; min-width: 0; }
  .chatter-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #fff; padding-right: 15px; }
  .tab-title { padding: 12px 20px; font-size: 13px; font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--primary); }
  .apps-counter { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .apps-counter input { width: 60px; padding: 4px 8px; border: 1px solid #ccc; border-radius: var(--radius); text-align: center; font-weight: 700; color: var(--primary); }

  .comment-form { padding: 20px; background: #fff; border-bottom: 1px solid var(--border); }
  .comment-form textarea { width: 100%; height: 70px; padding: 12px; border: 1px solid #ccc; border-radius: var(--radius); resize: none; font-size: 13px; margin-bottom: 10px; transition: border .2s; }
  .comment-form textarea:focus { border-color: var(--primary); outline: none; }
  .files-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .file-chip { background: #eef1f6; border: 1px solid #cbd5e1; border-radius: var(--radius); padding: 4px 10px; font-size: 11px; display: flex; gap: 8px; align-items: center;}
  .chip-remove { cursor: pointer; color: #ef4444; font-weight: 700; font-size: 14px; line-height: 1; flex-shrink: 0;}
  .form-actions { display: flex; justify-content: space-between; align-items: center; }
  .file-label { cursor: pointer; padding: 6px 12px; font-size: 12px; border-radius: var(--radius); background: #f1f1f1; border: 1px solid #ccc; transition: background .2s; }
  .file-label:hover { background: #e4e4e4; }

  .chatter-log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .log-empty { text-align: center; color: var(--muted); padding: 30px; font-style: italic; }
  .log-entry { display: flex; gap: 15px; }
  .log-avatar { width: 36px; height: 36px; color: #fff; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .log-body { flex: 1; background: #fff; padding: 12px 15px; border-radius: var(--radius); border: 1px solid #e2e8f0; min-width: 0; }
  .log-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; gap: 10px; align-items: flex-start; }
  .log-author { font-weight: 700; color: #1e293b; font-size: 13px; }
  .log-text { font-size: 13px; color: #334155; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .log-actions { display: flex; gap: 12px; font-size: 11px; opacity: 0; transition: opacity .15s; flex-shrink: 0; }
  .log-entry:hover .log-actions { opacity: 1; }
  .log-btn { cursor: pointer; font-weight: 500; color: var(--muted); }
  .log-btn:hover { color: var(--primary); text-decoration: underline; }
  .log-btn.del:hover { color: var(--danger); }

  .attachments { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; }
  .att-file { display: inline-flex; align-items: center; gap: 6px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: var(--radius); padding: 5px 10px; font-size: 12px; color: #334155; text-decoration: none; transition: background .2s;}
  .att-file:hover { background: #e2e8f0; }
  .att-size { color: #94a3b8; font-size: 10px; flex-shrink: 0; }
  .att-image img { max-width: 250px; max-height: 150px; border-radius: var(--radius); border: 1px solid #cbd5e1; display: block; object-fit: cover; }

  .inline-editor { display: none; margin-top: 5px; }
  .inline-editor.active { display: block; }
  .log-text.hidden { display: none; }
  .inline-editor textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--primary); border-radius: var(--radius); font-size: 13px; resize: vertical; margin-bottom: 8px; }
  .inline-edit-btns { display: flex; gap: 8px; justify-content: flex-end; }

  .users-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); margin-top: 15px; }
  .users-table th, .users-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
  .users-table th { background: #f9f9fb; font-weight: 700; color: #555; }
  .user-input { border: 1px solid transparent; background: transparent; padding: 4px 8px; width: 100%; font-size: 13px; border-radius: var(--radius); transition: border .2s; }
  .user-input:focus { border-color: var(--primary); background: #fff; outline: none; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity .2s;}
  .modal-backdrop.open { display: flex; opacity: 1; }
  .modal { background: #fff; padding: 30px; border-radius: var(--radius-lg); width: 100%; max-width: 450px; box-shadow: var(--shadow-lg); transform: translateY(20px); transition: transform .2s; max-height: 90vh; overflow-y: auto;}
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal h2 { margin-bottom: 20px; font-size: 18px; color: #1e293b; }
  .field { margin-bottom: 18px; }
  .field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #475569; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: var(--radius); font-size: 14px; transition: border .2s;}
  .field input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(113,75,103,.1); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }

  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { padding: 14px 20px; border-radius: var(--radius); color: #fff; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); animation: slideIn .3s cubic-bezier(0.16, 1, 0.3, 1); max-width: 350px; pointer-events: auto; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.hiding { animation: slideOut .2s ease-in forwards; }
  @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
  @keyframes slideOut { to { transform: translateX(120%); opacity: 0; } }
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <h2>Вход в CRM</h2>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input type="password" id="login-password" autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" id="btn-login">Войти</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<header>
  <div style="display:flex; align-items:center;">
    <span class="brand" data-action="go-home">CRM Детроид</span>
    <div class="nav-menu" id="admin-nav" style="display:none;">
      <span class="nav-item active" data-action="go-home" id="nav-leads">Лиды</span>
      <span class="nav-item" data-action="go-users" id="nav-users">Сотрудники</span>
    </div>
  </div>
  <div class="user-info">
    <span class="conn-dot" id="conn-dot" title="Связь с сервером"></span>
    <span id="user-display-name">...</span>
    <span class="logout-btn" data-action="logout">Выйти</span>
  </div>
</header>

<section id="kanban-view" class="view-section active">
  <div class="breadcrumb"><a data-action="go-home">CRM / Лиды</a></div>
  <div class="toolbar">
    <button class="btn btn-primary" data-action="new-lead">+ Создать лид</button>
    <div class="board-search" id="board-search-wrap">
      <div class="board-search-field">
        <input type="text" id="board-search" placeholder="Поиск по названию или ИНН" autocomplete="off" spellcheck="false">
        <button type="button" class="search-clear" id="board-search-clear" title="Очистить" aria-label="Очистить">×</button>
      </div>
      <div class="search-drop" id="search-drop"></div>
    </div>
    <div></div>
  </div>
  <div class="kanban-board" id="board"></div>
</section>

<section id="detail-view" class="view-section" style="background:#fff;">
  <div class="breadcrumb"><a data-action="go-home">CRM / Лиды</a><span>/</span><b id="crumb-name"></b></div>
  <div class="toolbar" style="background:#f9f9f9; padding:8px 20px;">
    <button class="btn btn-secondary btn-sm" data-action="go-home">← Назад к лидам</button>
    <div class="stages-row" id="stages-row" style="margin-left: 15px;"></div>
    <button class="btn btn-danger btn-sm" data-action="delete-lead" style="margin-left:auto;">🗑️ Удалить</button>
  </div>
  <div class="detail-body">
    <div class="form-panel">
      <input type="text" id="f-title" class="editable-title" placeholder="Название компании...">
      <div class="form-grid">
        <div>
          <div class="form-row"><div class="form-label">ИНН</div><input class="form-input" id="f-inn" placeholder="10 или 12 цифр" maxlength="12"></div>
          <div class="form-row"><div class="form-label">Продавец</div><input class="form-input" id="f-manager"></div>
        </div>
        <div>
          <div class="form-row"><div class="form-label">Email</div><input class="form-input" id="f-email" type="email"></div>
          <div class="form-row"><div class="form-label">Телефон</div><input class="form-input" id="f-phone"></div>
        </div>
      </div>
      <h3 class="section-title">Информация о клиенте</h3>
      <div class="form-grid">
        <div><div class="form-row"><div class="form-label">Что возят?</div><input class="form-input" id="f-cargo"></div><div class="form-row"><div class="form-label">Формат</div><input class="form-input" id="f-format"></div></div>
        <div><div class="form-row"><div class="form-label">Оплата</div><input class="form-input" id="f-payment"></div><div class="form-row"><div class="form-label">Тип АТИ</div><input class="form-input" id="f-ati"></div></div>
      </div>
    </div>
    <div class="chatter">
      <div class="chatter-header">
        <div class="tab-title">Лог примечания</div>
        <div class="apps-counter"><span>Заявки:</span><input type="number" id="f-apps" min="0" value="0"></div>
      </div>
      <div class="comment-form">
        <textarea id="comment-input" placeholder="Комментарий... Enter — отправить, Shift+Enter — новая строка"></textarea>
        <div class="files-preview" id="files-preview"></div>
        <div class="form-actions">
          <button class="btn btn-primary" data-action="post-comment">Записать в лог</button>
          <label class="file-label">📎 Прикрепить<input type="file" id="file-input" multiple hidden></label>
        </div>
      </div>
      <div class="chatter-log" id="chatter-log"></div>
    </div>
  </div>
</section>

<section id="users-view" class="view-section" style="padding: 20px; overflow-y: auto;">
  <div style="max-width: 900px; margin: 0 auto; width: 100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="color: var(--primary);">Сотрудники</h2>
      <button class="btn btn-primary" data-action="open-add-user">+ Добавить сотрудника</button>
    </div>
    <table class="users-table">
      <thead><tr><th style="width: 50px;">ID</th><th>Имя</th><th>E-mail</th><th>Новый пароль</th><th style="width: 150px;">Действия</th></tr></thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
</section>

<!-- МОДАЛКИ -->
<div class="modal-backdrop" id="modal-create">
  <div class="modal">
    <h2>Новый лид</h2>
    <div class="field"><label>Название компании *</label><input id="m-title"></div>
    <div class="field"><label>ИНН</label><input id="m-inn" maxlength="12"></div>
    <div class="field"><label>Телефон</label><input id="m-phone"></div>
    <div class="field"><label>Email</label><input id="m-email" type="email"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-action="close-modals">Отмена</button><button class="btn btn-primary" data-action="submit-lead">Создать</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-add-user">
  <div class="modal">
    <h2>Добавить сотрудника</h2>
    <div class="field"><label>Имя сотрудника</label><input id="u-name"></div>
    <div class="field"><label>E-mail (логин)</label><input id="u-email" type="email"></div>
    <div class="field"><label>Пароль (мин. 6 символов)</label><input id="u-pass" type="password"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-action="close-modals">Отмена</button><button class="btn btn-primary" data-action="submit-user">Добавить</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-prompt">
  <div class="modal">
    <h2 id="prompt-title"></h2>
    <p id="prompt-message" style="display:none; margin-bottom: 15px; color: #666;"></p>
    <div class="field"><input id="prompt-input"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-action="prompt-cancel">Отмена</button><button class="btn btn-primary" id="prompt-ok-btn">OK</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-confirm">
  <div class="modal">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message" style="margin-bottom: 15px; color: #666;"></p>
    <div class="modal-actions"><button class="btn btn-secondary" data-action="confirm-cancel">Отмена</button><button class="btn btn-danger" id="confirm-ok-btn">Подтвердить</button></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
'use strict';

const $  = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr = s => encodeURI(String(s ?? '')).replace(/"/g, '%22');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtTime = ts => new Date(ts).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtBytes = b => { if (!b) return '0 B'; const k=1024, s=['B','KB','MB']; const i=Math.min(2, Math.floor(Math.log(b)/Math.log(k))); return `${(b/Math.pow(k,i)).toFixed(1)} ${s[i]}`; };
const isValidEmail = v => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function formatInnInput(inp) { inp.value = inp.value.replace(/\D/g, '').slice(0, 12); }
function setupPhoneMask(input) {
  if (!input || input.dataset.maskInit) return;
  input.dataset.maskInit = '1';
  let last = '';
  input.addEventListener('input', e => {
    let d = input.value.replace(/\D/g, ''); if (!d) { input.value = ''; last = ''; return; }
    if (e.inputType === 'deleteContentBackward' && d === last && d.length > 0) d = d.slice(0, -1);
    if (!d || d === '7' || d === '8') { input.value = ''; last = ''; return; }
    if (d.startsWith('8')) d = '7' + d.slice(1); else if (!d.startsWith('7')) d = '7' + d;
    d = d.slice(0, 11); last = d;
    let f = '+7'; if (d.length > 1) f += ' (' + d.slice(1, 4); if (d.length >= 5) f += ') ' + d.slice(4, 7);
    if (d.length >= 8) f += '-' + d.slice(7, 9); if (d.length >= 10) f += '-' + d.slice(9, 11);
    input.value = f;
  });
}

const Toast = {
  show(m, t='success', ms=2500) {
    const el = document.createElement('div'); el.className = `toast ${t}`; el.textContent = m;
    $('#toast-container').appendChild(el);
    setTimeout(() => { el.classList.add('hiding'); setTimeout(() => el.remove(), 250); }, ms);
  },
  success(m) { this.show(m, 'success'); },
  error(m) { this.show(m, 'error', 4000); }
};

const Modal = {
  open(id) { $('#'+id).classList.add('open'); },
  closeAll() { $$('.modal-backdrop').forEach(m => m.classList.remove('open')); }
};

let _promptResolver = null, _confirmResolver = null;
function askPrompt(title, val='', msg='') {
  return new Promise(res => {
    if (_promptResolver) _promptResolver(null); _promptResolver = res;
    $('#prompt-title').textContent = title; $('#prompt-message').textContent = msg;
    $('#prompt-message').style.display = msg ? 'block' : 'none'; $('#prompt-input').value = val;
    Modal.open('modal-prompt'); setTimeout(() => { $('#prompt-input').focus(); $('#prompt-input').select(); }, 50);
    $('#prompt-ok-btn').onclick = () => { Modal.closeAll(); res($('#prompt-input').value); };
  });
}
function askConfirm(title, msg='') {
  return new Promise(res => {
    if (_confirmResolver) _confirmResolver(false); _confirmResolver = res;
    $('#confirm-title').textContent = title; $('#confirm-message').textContent = msg;
    Modal.open('modal-confirm'); $('#confirm-ok-btn').onclick = () => { Modal.closeAll(); res(true); };
  });
}

const Net = {
  csrf: null, hash: null, online: true,
  setOnline(v) { this.online = v; $('#conn-dot').classList.toggle('offline', !v); },
  async req(action, data = null, isFormData = false) {
    try {
      let url = `api.php?action=${encodeURIComponent(action)}`;
      if (action === 'get_data' && this.hash) url += `&hash=${encodeURIComponent(this.hash)}`;
      if (action === 'search_leads') {
        url += `&q=${encodeURIComponent((data && data.q) || '')}`;
        data = null;
      }
      const opts = { method: data ? 'POST' : 'GET', headers: {}, keepalive: true };
      if (this.csrf) opts.headers['X-CSRF-Token'] = this.csrf;
      if (isFormData) opts.body = data; else if (data) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(data); }
      const res = await fetch(url, opts); const json = await res.json();
      this.setOnline(true);
      if (json.need_login) { handleLogoutUI(json.error); return null; }
      return json;
    } catch (e) { this.setOnline(false); return { success: false, error: 'Сбой сети' }; }
  }
};

const Store = {
  state: { stages: [], leads: [], user: null },
  async load(force = false) {
    const res = await Net.req('get_data');
    if (!res || !res.success) return;
    if (res.unchanged && !force) return;

    if (res.hash) Net.hash = res.hash;
    this.state.stages = res.stages || [];
    this.state.leads = res.leads || [];
    this.state.user = res.user;

    $('#user-display-name').textContent = res.user.name;
    $('#login-overlay').classList.remove('show');
    $('#admin-nav').style.display = res.user.role === 'admin' ? 'flex' : 'none';

    if (UI.currentView === 'kanban') renderBoard();
    if (UI.currentView === 'lead' && UI.leadId) {
      const lead = this.getLead(UI.leadId);
      if (!lead) { goHome(true); return; }
      renderDetailStages(); renderLog();
      if (!UI.formDirty) fillLeadForm(lead);
    }
    if (UI.currentView === 'users') loadUsers();
  },
  getLead(id) {
    if (!id) return null;
    return this.state.leads.find(l => String(l.id).trim() === String(id).trim());
  }
};

const UI = { leadId: null, pendingFiles: [], drag: {}, currentView: 'kanban', formDirty: false, editingCommentId: null, lock: false };

function closeSearchDrop() { $('#search-drop')?.classList.remove('open'); }

function placeSearchDrop() {
  const inp = $('#board-search'), box = $('#search-drop');
  if (!inp || !box) return;
  const r = inp.getBoundingClientRect();
  box.style.left = Math.max(8, r.left) + 'px';
  box.style.width = Math.max(240, r.width) + 'px';
  box.style.top = (r.bottom + 4) + 'px';
}

function localSearchLeads(q) {
  const query = String(q || '').trim().toLowerCase();
  const digits = query.replace(/\D/g, '');
  if (!query) return [];
  return Store.state.leads.filter(l => {
    const title = String(l.title || '').toLowerCase();
    const inn = String(l.inn || '').replace(/\D/g, '');
    return title.includes(query) || (digits.length >= 2 && inn.includes(digits));
  }).slice(0, 40).map(l => ({ id: l.id, title: l.title, inn: l.inn, stage: l.stage, phone: l.phone }));
}

function ownersOf(lead, intersections) {
  const inn = String(lead.inn || '').replace(/\D/g, '');
  const title = String(lead.title || '').toLowerCase();
  const names = [];
  (intersections || []).forEach(it => {
    const iInn = String(it.inn || '').replace(/\D/g, '');
    const same = (inn && iInn && inn === iInn) || (!inn && String(it.title || '').toLowerCase() === title);
    if (same) (it.users || []).forEach(n => { if (n && !names.includes(n)) names.push(n); });
  });
  return names;
}

function renderSearchDrop(payload) {
  const box = $('#search-drop'); if (!box) return;
  const leads = payload.leads || [];
  const inter = payload.intersections || [];
  const used = new Set();
  let html = '';
  leads.forEach(l => {
    const names = ownersOf(l, inter);
    if (String(l.inn || '').replace(/\D/g, '')) used.add('inn:' + String(l.inn).replace(/\D/g, ''));
    else used.add('t:' + String(l.title || '').toLowerCase());
    const warn = names.length ? `<div class="search-item-warn">Есть пересечения, карточка у ${esc(names.join(', '))}</div>` : '';
    const meta = [l.inn ? 'ИНН ' + l.inn : '', l.stage || ''].filter(Boolean).join(' · ');
    html += `<div class="search-item" data-action="open-search-lead" data-id="${esc(l.id)}"><div class="search-item-title">${esc(l.title)}</div><div class="search-item-meta">${esc(meta)}</div>${warn}</div>`;
  });
  inter.forEach(it => {
    const inn = String(it.inn || '').replace(/\D/g, '');
    const key = inn ? ('inn:' + inn) : ('t:' + String(it.title || '').toLowerCase());
    if (used.has(key)) return;
    const names = (it.users || []).filter(Boolean);
    if (!names.length) return;
    const meta = it.inn ? 'ИНН ' + it.inn : '';
    html += `<div class="search-item other"><div class="search-item-title">${esc(it.title)}</div>${meta ? `<div class="search-item-meta">${esc(meta)}</div>` : ''}<div class="search-item-warn">Есть пересечения, карточка у ${esc(names.join(', '))}</div></div>`;
  });
  if (!html) html = '<div class="search-empty">Ничего не найдено</div>';
  box.innerHTML = html;
  placeSearchDrop();
  box.classList.add('open');
}

let _searchGen = 0;
async function liveSearch(q) {
  const wrap = $('#board-search-wrap');
  const query = String(q || '').trim();
  wrap?.classList.toggle('has-query', !!query);
  if (!query) { closeSearchDrop(); return; }
  const local = localSearchLeads(query);
  renderSearchDrop({ leads: local, intersections: [] });
  const gen = ++_searchGen;
  const res = await Net.req('search_leads', { q: query });
  if (gen !== _searchGen) return;
  if (res && res.success) {
    const leads = (res.leads && res.leads.length) ? res.leads : local;
    renderSearchDrop({ leads, intersections: res.intersections || [] });
  }
}

function clearSearch() {
  const inp = $('#board-search'); if (inp) inp.value = '';
  $('#board-search-wrap')?.classList.remove('has-query');
  closeSearchDrop();
}

function handleLogoutUI(msg) {
  stopPolling();
  UI.leadId = null; UI.editingCommentId = null; UI.formDirty = false;
  Store.state.user = null; Store.state.leads = []; Store.state.stages = [];
  clearSearch();
  history.replaceState(null, '', location.pathname);
  $$('.view-section').forEach(el => el.classList.remove('active'));
  $('#kanban-view').classList.add('active');
  $('#login-overlay').classList.add('show');
  if (msg && msg !== 'Сессия истекла') Toast.error(msg);
}

function withLock(fn) { return async (...args) => { if (UI.lock) return; UI.lock = true; try { await fn(...args); } finally { UI.lock = false; } }; }

/* === НАВИГАЦИЯ (РОУТЕР) === */
function handleHashRouting() {
  const hash = window.location.hash;
  if (hash.startsWith('#lead/')) {
    const targetLeadId = decodeURIComponent(hash.replace('#lead/', ''));
    if (Store.getLead(targetLeadId)) { openLead(targetLeadId, false); return; }
  } else if (hash === '#users' && Store.state.user?.role === 'admin') {
    switchView('users-view', false); return;
  }
  switchView('kanban-view', false);
}

// При нажатии кнопок Назад/Вперед в браузере
window.addEventListener('popstate', () => { if (Store.state.user) handleHashRouting(); });

async function switchView(viewId, updateHash = true) {
  if (UI.leadId && UI.formDirty) await saveLeadForm(true);
  UI.leadId = null; UI.pendingFiles = []; UI.formDirty = false; UI.editingCommentId = null;
  UI.currentView = viewId.replace('-view', '');

  $$('.view-section').forEach(el => el.classList.remove('active'));
  $$('.nav-item').forEach(el => el.classList.remove('active'));
  $('#'+viewId).classList.add('active');

  if (viewId === 'kanban-view') {
    $('#nav-leads')?.classList.add('active');
    if (updateHash) history.pushState(null, '', '#kanban');
    renderBoard();
  } else if (viewId === 'users-view') {
    $('#nav-users')?.classList.add('active');
    if (updateHash) history.pushState(null, '', '#users');
    loadUsers();
  }
}

function goHome(updateHash = true) { switchView('kanban-view', updateHash); }

function openLead(id, updateHash = true) {
  const lead = Store.getLead(id); if (!lead) return goHome(updateHash);

  if (UI.leadId && UI.formDirty && UI.leadId !== id) saveLeadForm(false);

  UI.leadId = id; UI.currentView = 'lead'; UI.pendingFiles = []; UI.formDirty = false;
  $$('.view-section').forEach(el => el.classList.remove('active'));
  $('#detail-view').classList.add('active');
  fillLeadForm(lead);

  if (updateHash && window.location.hash !== '#lead/' + encodeURIComponent(id)) {
    history.pushState(null, '', '#lead/' + encodeURIComponent(id));
  }

  renderDetailStages(); renderFiles(); renderLog();
}

async function loadUsers() {
  const res = await Net.req('get_users'); if (!res || !res.success) return;
  const tbody = $('#users-tbody'); tbody.innerHTML = '';
  const currId = Store.state.user.id;
  res.users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.id}</td>
      <td><input class="user-input" id="uname-${u.id}" value="${esc(u.name)}"></td>
      <td><input class="user-input" id="uemail-${u.id}" value="${esc(u.email)}"></td>
      <td><input class="user-input" id="upass-${u.id}" type="password" placeholder="Пусто = не менять"></td>
      <td>
        <button class="btn btn-primary btn-sm" data-action="save-user" data-id="${u.id}">💾</button>
        ${u.id !== currId && u.id !== 1 ? `<button class="btn btn-danger btn-sm" data-action="delete-user" data-id="${u.id}">🗑️</button>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });
}

async function execLogin() {
  const email = $('#login-email').value.trim(), password = $('#login-password').value;
  $('#login-err').textContent = '';
  if (!email || !password) { $('#login-err').textContent = 'Заполните поля'; return; }
  $('#btn-login').disabled = true;
  const res = await Net.req('login', { email, password });
  $('#btn-login').disabled = false;
  if (res && res.success) { Net.csrf = res.csrf; $('#login-password').value = ''; await Store.load(true); handleHashRouting(); startPolling(); }
  else { $('#login-err').textContent = res?.error || 'Ошибка входа'; }
}

async function execLogout() {
  if (UI.formDirty && !await askConfirm('Есть несохранённые изменения', 'Выйти без сохранения?')) return;
  await Net.req('logout'); location.reload();
}

function fillLeadForm(lead) {
  $('#f-title').value = lead.title;
  ['inn','phone','email','manager','cargo','format','payment','ati'].forEach(f => {
    const el = $(`#f-${f}`); if (el && document.activeElement !== el) el.value = lead[f] || '';
  });
  if (document.activeElement !== $('#f-apps')) $('#f-apps').value = lead.applicationsCount || 0;
  $('#crumb-name').textContent = lead.title; setupPhoneMask($('#f-phone'));
}

async function saveLeadForm(sync = false) {
  if (!UI.leadId) return; const lead = Store.getLead(UI.leadId); if (!lead) return;
  const patch = { id: UI.leadId, title: $('#f-title').value.trim() || 'Без названия', inn: $('#f-inn').value.trim(), phone: $('#f-phone').value.trim(), email: $('#f-email').value.trim(), manager: $('#f-manager').value.trim(), cargo: $('#f-cargo').value.trim(), format: $('#f-format').value.trim(), payment: $('#f-payment').value.trim(), ati: $('#f-ati').value.trim(), applicationsCount: parseInt($('#f-apps').value) || 0, stage: lead.stage };
  Object.assign(lead, patch); $('#crumb-name').textContent = patch.title; UI.formDirty = false;
  if (sync) await Net.req('save_lead', patch); else Net.req('save_lead', patch);
}
const saveLeadDebounced = debounce(() => saveLeadForm(false), 500);

let _lastBoardHash = null;
function renderBoard() {
  if (UI.currentView !== 'kanban') return;
  const dataHash = JSON.stringify([Store.state.stages, Store.state.leads.map(l => [l.id, l.stage, l.title, l.phone, l.manager, l.inn])]);
  if (dataHash === _lastBoardHash) return; _lastBoardHash = dataHash;

  const board = $('#board'); board.innerHTML = ''; const frag = document.createDocumentFragment();
  Store.state.stages.forEach(stage => {
    const leads = Store.state.leads.filter(l => l.stage === stage);
    const col = document.createElement('div'); col.className = 'column'; col.dataset.stage = stage; col.draggable = true;
    col.innerHTML = `<div class="column-header"><div class="col-title"><span>${esc(stage)}</span><span class="col-edit" data-action="edit-stage">✎</span></div><span class="col-count">${leads.length}</span></div><div class="cards-container"></div>`;
    const cont = col.querySelector('.cards-container');
    leads.forEach(l => {
      const card = document.createElement('div'); card.className = 'card'; card.draggable = true; card.dataset.id = l.id;
      const innLine = l.inn ? `<span>ИНН ${esc(l.inn)}</span>` : '<span></span>';
      card.innerHTML = `<div class="card-title">${esc(l.title)}</div><div class="card-meta">${innLine}<span>📱 ${esc(l.phone || 'Нет')}</span></div>`;
      cont.appendChild(card);
    });
    frag.appendChild(col);
  });
  const add = document.createElement('div'); add.className = 'add-column'; add.textContent = '+ Добавить этап'; add.dataset.action = 'add-stage'; frag.appendChild(add);
  board.appendChild(frag);
}

function renderDetailStages() {
  const row = $('#stages-row'), lead = Store.getLead(UI.leadId); if (!lead) return; row.innerHTML = '';
  Store.state.stages.forEach(s => {
    const b = document.createElement('button'); b.className = 'stage-btn' + (s === lead.stage ? ' active' : '');
    b.dataset.action = 'set-stage'; b.dataset.stage = s; b.textContent = s; row.appendChild(b);
  });
}

function renderFiles() {
  const box = $('#files-preview'); box.innerHTML = '';
  UI.pendingFiles.forEach((f, i) => {
    const el = document.createElement('div'); el.className = 'file-chip';
    el.innerHTML = `<span>📎 ${esc(f.name)}</span> <span class="chip-remove" data-action="rm-file" data-idx="${i}">×</span>`;
    box.appendChild(el);
  });
}

function renderLog() {
  const lead = Store.getLead(UI.leadId); const log = $('#chatter-log');
  if (!lead || !lead.comments || !lead.comments.length) { log.innerHTML = '<div class="log-empty">Лог пуст</div>'; return; }
  log.innerHTML = '';
  const cu = Store.state.user.name, isAdm = Store.state.user.role === 'admin';
  const frag = document.createDocumentFragment();

  [...lead.comments].reverse().forEach(c => {
    const isSys = c.author === 'Система', canEdit = !isSys && (isAdm || c.author === cu);
    const init = isSys ? '⚙' : (c.author[0] || '?').toUpperCase(), bg = isSys ? '#cbd5e1' : '#714B67';
    const atts = (c.attachments || []).map(a => {
      const u = escAttr(a.dataUrl), n = esc(a.name);
      if ((a.type || '').startsWith('image/')) return `<div class="att-image"><a href="${u}" target="_blank" rel="noopener"><img src="${u}"></a></div>`;
      return `<a class="att-file" href="${u}" download="${n}" rel="noopener">📄 ${n} <span class="att-size">${fmtBytes(a.size)}</span></a>`;
    }).join('');

    const el = document.createElement('div'); el.className = 'log-entry';
    el.innerHTML = `
      <div class="log-avatar" style="background:${bg}">${esc(init)}</div>
      <div class="log-body">
        <div class="log-head">
          <div><div class="log-author">${esc(c.author)}</div><div>${esc(fmtTime(c.time))}${c.editedAt ? ` <span style="color:#714B67;font-style:italic">изм. ${esc(fmtTime(c.editedAt))}</span>` : ''}</div></div>
          ${canEdit ? `<div class="log-actions"><span class="log-btn" data-action="toggle-edit" data-cid="${esc(c.id)}">✎ Изменить</span><span class="log-btn del" data-action="del-comment" data-cid="${esc(c.id)}">🗑️</span></div>` : ''}
        </div>
        <div class="log-text" data-txt="${esc(c.id)}">${esc(c.text)}</div>
        <div class="inline-editor" data-edt="${esc(c.id)}">
          <textarea data-inp="${esc(c.id)}">${esc(c.text)}</textarea>
          <div class="inline-edit-btns"><button class="btn btn-secondary btn-sm" data-action="toggle-edit" data-cid="${esc(c.id)}">Отмена</button><button class="btn btn-primary btn-sm" data-action="save-comment" data-cid="${esc(c.id)}">Сохранить</button></div>
        </div>
        ${atts ? `<div class="attachments">${atts}</div>` : ''}
      </div>`;
    frag.appendChild(el);
  });
  log.appendChild(frag);

  if (UI.editingCommentId) {
    const edt = $(`[data-edt="${UI.editingCommentId}"]`), txt = $(`[data-txt="${UI.editingCommentId}"]`);
    if (edt && txt) { edt.classList.add('active'); txt.classList.add('hidden'); }
  }
}

function initEvents() {
  setupPhoneMask($('#m-phone')); setupPhoneMask($('#f-phone'));
  $('#m-inn').addEventListener('input', e => formatInnInput(e.target));
  $('#f-inn').addEventListener('input', e => formatInnInput(e.target));

  const searchInp = $('#board-search');
  const runSearch = debounce(() => liveSearch(searchInp.value), 150);
  searchInp.addEventListener('input', runSearch);
  searchInp.addEventListener('focus', () => { if (searchInp.value.trim()) liveSearch(searchInp.value); });
  searchInp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = $('#search-drop .search-item[data-id]');
      if (first) { closeSearchDrop(); openLead(first.dataset.id, true); }
    } else if (e.key === 'Escape' && (searchInp.value || $('#search-drop.open'))) {
      e.preventDefault(); e.stopPropagation();
      clearSearch();
    }
  });
  $('#board-search-clear').addEventListener('click', () => { clearSearch(); searchInp.focus(); });
  document.addEventListener('click', e => {
    if (!e.target.closest('#board-search-wrap') && !e.target.closest('#search-drop')) closeSearchDrop();
  });
  window.addEventListener('resize', () => { if ($('#search-drop.open')) placeSearchDrop(); });

  $('#btn-login').addEventListener('click', execLogin);
  $('#login-password').addEventListener('keydown', e => { if (e.key === 'Enter') execLogin(); });
  $('#login-email').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-password').focus(); });

  window.addEventListener('beforeunload', e => { if (UI.formDirty) { saveLeadForm(false); } });
  $('#detail-view').addEventListener('input', e => { if (e.target.matches('.form-input, .editable-title, #f-apps')) { UI.formDirty = true; saveLeadDebounced(); } });

  $('#comment-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('[data-action="post-comment"]').click(); } });
  $('#chatter-log').addEventListener('keydown', e => { if (e.target.matches('.inline-editor textarea') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $(`[data-action="save-comment"][data-cid="${e.target.dataset.inp}"]`).click(); } });

  $('#file-input').addEventListener('change', e => {
    const allow = new Set(['png','jpg','jpeg','gif','webp','bmp','pdf','txt','csv','doc','docx','xls','xlsx','ppt','pptx','zip','7z']);
    [...e.target.files].forEach(f => {
      if (f.size > 5 * 1024 * 1024) return Toast.error(`Файл "${f.name}" > 5МБ`);
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      if (!allow.has(ext) || /\.(php|phtml|phar|cgi|exe|js|htm|html|svg|shtml)(\.|$)/i.test(f.name)) {
        return Toast.error(`Файл "${f.name}" не разрешён`);
      }
      UI.pendingFiles.push({ name: f.name, size: f.size, type: f.type, rawFile: f });
    });
    e.target.value = ''; renderFiles();
  });

  document.body.addEventListener('click', async e => {
    const actEl = e.target.closest('[data-action]'); if (!actEl) return;
    const act = actEl.dataset.action;

    if (act === 'prompt-cancel') {
      const r = _promptResolver; _promptResolver = null;
      Modal.closeAll(); if (r) r(null);
      return;
    }
    if (act === 'confirm-cancel') {
      const r = _confirmResolver; _confirmResolver = null;
      Modal.closeAll(); if (r) r(false);
      return;
    }
    if (act === 'close-modals') { Modal.closeAll(); return; }

    await withLock(async () => {
    switch (act) {
      case 'open-search-lead':
        if (actEl.dataset.id) { closeSearchDrop(); openLead(actEl.dataset.id, true); }
        break;
      case 'go-home': goHome(true); break;
      case 'go-users': switchView('users-view', true); break;
      case 'logout': execLogout(); break;
      case 'new-lead': $$('#modal-create input').forEach(i => i.value = ''); Modal.open('modal-create'); setTimeout(() => $('#m-title').focus(), 50); break;
      case 'open-add-user': $$('#modal-add-user input').forEach(i => i.value = ''); Modal.open('modal-add-user'); setTimeout(() => $('#u-name').focus(), 50); break;

      case 'submit-lead':
        const t = $('#m-title').value.trim(), i = $('#m-inn').value.trim(), em = $('#m-email').value.trim();
        if (!t) return Toast.error('Введите название');
        if (i && i.length !== 10 && i.length !== 12) return Toast.error('ИНН 10 или 12 цифр');
        const resL = await Net.req('save_lead', { id: 'l_'+uid(), title: t, inn: i, phone: $('#m-phone').value.trim(), email: em, manager: Store.state.user.name, stage: Store.state.stages[0], applicationsCount: 0 });
        if (resL?.success) { Modal.closeAll(); await Store.load(true); } else Toast.error(resL?.error || 'Ошибка');
        break;

      case 'submit-user':
        const n = $('#u-name').value.trim(), ue = $('#u-email').value.trim(), p = $('#u-pass').value;
        if (!n || !ue || !p) return Toast.error('Все поля');
        const resU = await Net.req('register_user', { name: n, email: ue, password: p });
        if (resU?.success) { Toast.success('Добавлен'); Modal.closeAll(); loadUsers(); } else Toast.error(resU?.error || 'Ошибка');
        break;

      case 'save-user': {
        const id = actEl.dataset.id, un = $(`#uname-${id}`).value.trim(), uem = $(`#uemail-${id}`).value.trim(), up = $(`#upass-${id}`).value;
        if (!un || !uem) return Toast.error('Обязательны Имя и Email');
        const resS = await Net.req('update_user', { id: +id, name: un, email: uem, password: up });
        if (resS?.success) { Toast.success('Сохранено'); loadUsers(); } else Toast.error(resS?.error || 'Ошибка');
        break;
      }

      case 'delete-user':
        if (await askConfirm('Удалить сотрудника?')) { const resD = await Net.req('delete_user', { id: +actEl.dataset.id }); if (resD?.success) { Toast.success('Удален'); loadUsers(); Store.load(true); } }
        break;

      case 'add-stage':
        const stN = await askPrompt('Новый этап', '', 'Название этапа'); if (!stN || !stN.trim()) return;
        const resSt = await Net.req('save_stages', { stages: [...Store.state.stages, stN.trim()] });
        if (resSt?.success) await Store.load(true); else Toast.error(resSt?.error || 'Ошибка');
        break;

      case 'edit-stage':
        const oldSt = actEl.closest('.column').dataset.stage, newSt = await askPrompt('Изменить этап', oldSt, 'Пустое = удалить');
        if (newSt === null || newSt.trim() === oldSt) return;
        let ns = [...Store.state.stages];
        if (!newSt.trim()) {
          if (ns.length <= 1) return Toast.error('Нельзя удалить последний');
          if (!await askConfirm('Удалить?', 'Лиды будут перенесены')) return;
          ns = ns.filter(s => s !== oldSt);
        } else {
          if (ns.includes(newSt.trim())) return Toast.error('Имя занято');
          ns[ns.indexOf(oldSt)] = newSt.trim();
        }
        const resESt = await Net.req('save_stages', { stages: ns });
        if (resESt?.success) await Store.load(true); else Toast.error(resESt?.error || 'Ошибка');
        break;

      case 'delete-lead':
        if (!await askConfirm('Удалить лид?', 'Навсегда')) return;
        const resDL = await Net.req('delete_lead', { id: UI.leadId });
        if (resDL?.success) { goHome(true); await Store.load(true); } else Toast.error(resDL?.error || 'Ошибка');
        break;

      case 'set-stage':
        const lead = Store.getLead(UI.leadId); if (!lead) return;
        if (UI.formDirty) await saveLeadForm(true);
        const resMS = await Net.req('move_lead', { id: UI.leadId, stage: actEl.dataset.stage, from: lead.stage });
        if (resMS?.success) await Store.load(true); else Toast.error(resMS?.error || 'Ошибка');
        break;

      case 'post-comment':
        const txt = $('#comment-input').value.trim(); if (!txt && !UI.pendingFiles.length) return;
        const fd = new FormData(); fd.append('lead_id', UI.leadId); fd.append('text', txt);
        UI.pendingFiles.forEach(f => fd.append('files[]', f.rawFile));
        const resPC = await Net.req('add_comment', fd, true);
        if (resPC?.success) { $('#comment-input').value = ''; UI.pendingFiles = []; renderFiles(); await Store.load(true); } else Toast.error(resPC?.error || 'Ошибка');
        break;

      case 'rm-file': UI.pendingFiles.splice(+actEl.dataset.idx, 1); renderFiles(); break;

      case 'toggle-edit':
        const cid = actEl.dataset.cid;
        const edt = $(`[data-edt="${cid}"]`), txtEl = $(`[data-txt="${cid}"]`), inp = $(`[data-inp="${cid}"]`);
        if (!edt) return; const active = edt.classList.contains('active');
        $$('.inline-editor.active').forEach(e => e.classList.remove('active')); $$('.log-text.hidden').forEach(e => e.classList.remove('hidden'));
        if (!active) { txtEl.classList.add('hidden'); edt.classList.add('active'); UI.editingCommentId = cid; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        else { UI.editingCommentId = null; }
        break;

      case 'save-comment':
        const v = $(`[data-inp="${actEl.dataset.cid}"]`).value.trim(); if (!v) return Toast.error('Пусто');
        const resSC = await Net.req('edit_comment', { id: actEl.dataset.cid, text: v });
        if (resSC?.success) { UI.editingCommentId = null; await Store.load(true); } else Toast.error(resSC?.error || 'Ошибка');
        break;

      case 'del-comment':
        if (!await askConfirm('Удалить комментарий?')) return;
        const resDC = await Net.req('delete_comment', { id: actEl.dataset.cid });
        if (resDC?.success) { UI.editingCommentId = null; await Store.load(true); } else Toast.error(resDC?.error || 'Ошибка');
        break;
    }
    })();
  });

  $('#board').addEventListener('click', e => {
    if (e.target.closest('.col-edit') || e.target.closest('.add-column')) return;
    const card = e.target.closest('.card'); if (card) openLead(card.dataset.id, true);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('.inline-editor.active')) { $$('.inline-editor.active').forEach(el=>el.classList.remove('active')); $$('.log-text.hidden').forEach(el=>el.classList.remove('hidden')); UI.editingCommentId = null; }
      else if ($('.modal-backdrop.open')) {
        const pr = _promptResolver; _promptResolver = null;
        const cr = _confirmResolver; _confirmResolver = null;
        if (pr) pr(null); if (cr) cr(false); Modal.closeAll();
      }
    }
  });

  const b = $('#board');
  b.addEventListener('dragstart', e => {
    const card = e.target.closest('.card'), col = e.target.closest('.column');
    if (card) { UI.drag = { t: 'card', id: card.dataset.id }; card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.id); e.stopPropagation(); }
    else if (col) { UI.drag = { t: 'col', s: col.dataset.stage }; col.classList.add('dragging'); e.dataTransfer.setData('text/plain', col.dataset.stage); }
  });
  b.addEventListener('dragend', () => { $$('.dragging, .drop-target').forEach(el => el.classList.remove('dragging', 'drop-target')); UI.drag = {}; });
  b.addEventListener('dragover', e => { if (UI.drag.t && e.target.closest('.column')) e.preventDefault(); });
  b.addEventListener('dragenter', e => { const c = e.target.closest('.column'); if (c && UI.drag.t) c.classList.add('drop-target'); });
  b.addEventListener('dragleave', e => { const c = e.target.closest('.column'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop-target'); });
  b.addEventListener('drop', withLock(async e => {
    const c = e.target.closest('.column'); if (!c) return; e.preventDefault(); const tgt = c.dataset.stage;
    if (UI.drag.t === 'card') {
      const lead = Store.getLead(UI.drag.id); if (!lead || lead.stage === tgt) return;
      const res = await Net.req('move_lead', { id: UI.drag.id, stage: tgt, from: lead.stage });
      if (res?.success) Store.load(true);
    } else if (UI.drag.t === 'col') {
      const ns = [...Store.state.stages], f = ns.indexOf(UI.drag.s), t = ns.indexOf(tgt);
      if (f >= 0 && t >= 0 && f !== t) { ns.splice(t, 0, ns.splice(f, 1)[0]); const res = await Net.req('save_stages', { stages: ns }); if (res?.success) Store.load(true); }
    }
  }));

  Net.req('check_auth').then(async check => {
    if (check?.success) { Net.csrf = check.csrf; await Store.load(true); handleHashRouting(); startPolling(); }
    else { $('#login-overlay').classList.add('show'); setTimeout(() => $('#login-email').focus(), 50); }
  });
}

let pollTimer = null;
function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => {
    if (!document.hidden && !UI.drag.t && !UI.formDirty && !$('.modal-backdrop.open') && !$('.inline-editor.active')) {
      Store.load(false);
    }
  }, 5000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) Store.load(false); });

initEvents();
</script>
</body>
</html>
